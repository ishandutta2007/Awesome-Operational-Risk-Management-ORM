<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="border-radius: 12px; background: #070b14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Animated Accent Gradients -->
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#10b981;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#3b82f6;#10b981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="radialCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15;0.35;0.15" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialPurple" cx="80%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.25;0.10;0.25" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" rx="12" fill="url(#bgGrad)" />

  <!-- Ambient Pulsing Glow Fields -->
  <circle cx="240" cy="140" r="280" fill="url(#radialCyan)" />
  <circle cx="980" cy="180" r="320" fill="url(#radialPurple)" />

  <!-- Tech Geometric Grid Background Pattern -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Risk Flow Lines (Simulating continuous monitoring & mitigation) -->
  <g opacity="0.35">
    <path d="M 60,370 C 260,310 420,380 620,320 S 950,260 1140,290" fill="none" stroke="url(#glowGrad1)" stroke-width="2.5" stroke-dasharray="8,6">
      <animate attributeName="stroke-dashoffset" values="0;-140" dur="12s" repeatCount="indefinite" />
    </path>
    <path d="M 60,390 C 310,340 520,395 780,345 S 1020,310 1140,320" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;120" dur="16s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Background Decorative Risk Heatmap Widget (Subtle Right-Side Element) -->
  <g transform="translate(940, 50)" opacity="0.45" filter="url(#cardShadow)">
    <rect width="200" height="150" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="15" y="24" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">RISK HEATMAP (5x5)</text>
    
    <!-- Mini Heatmap Cells -->
    <g transform="translate(15, 36)">
      <!-- Row 1 (High/Critical) -->
      <rect x="0" y="0" width="30" height="18" rx="3" fill="#ef4444" opacity="0.85" />
      <rect x="34" y="0" width="30" height="18" rx="3" fill="#ef4444" opacity="0.9" />
      <rect x="68" y="0" width="30" height="18" rx="3" fill="#dc2626" opacity="0.95">
        <animate attributeName="opacity" values="0.95;0.6;0.95" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="102" y="0" width="30" height="18" rx="3" fill="#b91c1c" />
      <rect x="136" y="0" width="30" height="18" rx="3" fill="#7f1d1d" />

      <!-- Row 2 -->
      <rect x="0" y="22" width="30" height="18" rx="3" fill="#f59e0b" opacity="0.75" />
      <rect x="34" y="22" width="30" height="18" rx="3" fill="#f97316" opacity="0.85" />
      <rect x="68" y="22" width="30" height="18" rx="3" fill="#ef4444" opacity="0.8" />
      <rect x="102" y="22" width="30" height="18" rx="3" fill="#ef4444" opacity="0.9" />
      <rect x="136" y="22" width="30" height="18" rx="3" fill="#dc2626" />

      <!-- Row 3 -->
      <rect x="0" y="44" width="30" height="18" rx="3" fill="#10b981" opacity="0.7" />
      <rect x="34" y="44" width="30" height="18" rx="3" fill="#f59e0b" opacity="0.8" />
      <rect x="68" y="44" width="30" height="18" rx="3" fill="#f97316" opacity="0.85" />
      <rect x="102" y="44" width="30" height="18" rx="3" fill="#ef4444" opacity="0.8" />
      <rect x="136" y="44" width="30" height="18" rx="3" fill="#ef4444" opacity="0.9" />

      <!-- Row 4 -->
      <rect x="0" y="66" width="30" height="18" rx="3" fill="#10b981" opacity="0.8" />
      <rect x="34" y="66" width="30" height="18" rx="3" fill="#10b981" opacity="0.75" />
      <rect x="68" y="66" width="30" height="18" rx="3" fill="#f59e0b" opacity="0.8" />
      <rect x="102" y="66" width="30" height="18" rx="3" fill="#f59e0b" opacity="0.85" />
      <rect x="136" y="66" width="30" height="18" rx="3" fill="#f97316" />

      <!-- Row 5 -->
      <rect x="0" y="88" width="30" height="18" rx="3" fill="#059669" opacity="0.9" />
      <rect x="34" y="88" width="30" height="18" rx="3" fill="#10b981" opacity="0.8" />
      <rect x="68" y="88" width="30" height="18" rx="3" fill="#10b981" opacity="0.7" />
      <rect x="102" y="88" width="30" height="18" rx="3" fill="#f59e0b" opacity="0.75" />
      <rect x="136" y="88" width="30" height="18" rx="3" fill="#f59e0b" opacity="0.8" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: High Contrast, Protected from Overlap -->

  <!-- Top Category Pill / Status Tag -->
  <g transform="translate(80, 48)">
    <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="20" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.5">ENTERPRISE RISK &amp; GRC</text>
  </g>

  <!-- Main Hero Title -->
  <text x="80" y="128" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-0.8" filter="url(#cardShadow)">
    Awesome Operational Risk
  </text>
  <text x="80" y="180" fill="url(#glowGrad1)" font-size="44" font-weight="900" letter-spacing="-0.8">
    Management (ORM)
  </text>

  <!-- Subtitle / Mission Statement -->
  <text x="80" y="225" fill="#cbd5e1" font-size="18.5" font-weight="400" letter-spacing="0.2">
    Curated SaaS Platforms, Enterprise GRC Systems &amp; Sovereign Open-Source Toolkits
  </text>
  <text x="80" y="254" fill="#94a3b8" font-size="14.5" font-weight="400">
    Covering Risk Registers • Inherent &amp; Residual Scoring • Loss Events • Control Testing • Operational Resilience
  </text>

  <!-- Bottom Interactive / Feature Pills Bar -->
  <g transform="translate(80, 310)">
    <!-- Pill 1: Risk Registers -->
    <g transform="translate(0, 0)">
      <rect width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-size="12.5" font-weight="600">📋 Risk Registers</text>
    </g>

    <!-- Pill 2: Controls & Audits -->
    <g transform="translate(172, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-size="12.5" font-weight="600">🛡️ Control Testing</text>
    </g>

    <!-- Pill 3: Loss Events & KRIs -->
    <g transform="translate(364, 0)">
      <rect width="195" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-size="12.5" font-weight="600">📊 Loss Data &amp; KRIs</text>
    </g>

    <!-- Pill 4: DORA & Basel III -->
    <g transform="translate(571, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-size="12.5" font-weight="600">⚖️ Basel III &amp; DORA</text>
    </g>

    <!-- Pill 5: MCP & AI Agents -->
    <g transform="translate(763, 0)">
      <rect width="185" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-size="12.5" font-weight="600">🤖 AI &amp; MCP Toolkits</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#glowGrad1)" />
</svg>
